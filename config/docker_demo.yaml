# Helios Docker Compose Demo Configuration
server:
  host: "0.0.0.0"
  port: 8080
  workers: 2
  max_connections: 10000
  buffer_pool_blocks: 4096
  buffer_block_size: 16384
  io_uring_entries: 512

backend_pools:
  - name: "web_backends"
    algorithm: "round_robin"
    endpoints:
      - host: "backend1"
        port: 80
        weight: 1
      - host: "backend2"
        port: 80
        weight: 1

timeouts:
  idle_timeout_ms: 30000
  header_read_timeout_ms: 5000
  connect_timeout_ms: 2000
  half_close_fallback_ms: 5000
  drain_timeout_ms: 15000

health_check:
  enabled: true
  interval_ms: 5000
  timeout_ms: 1000
  unhealthy_threshold: 3
  healthy_threshold: 2

metrics:
  enabled: true
  port: 9090
  path: "/metrics"
