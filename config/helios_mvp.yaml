# Helios MVP Configuration (Single-Worker Baseline)
server:
  host: "0.0.0.0"
  port: 8080
  workers: 1
  max_connections: 10000
  buffer_pool_blocks: 4096
  buffer_block_size: 16384

backend_pools:
  - name: "default_pool"
    algorithm: "round_robin"
    endpoints:
      - host: "127.0.0.1"
        port: 9001
      - host: "127.0.0.1"
        port: 9002

timeouts:
  idle_timeout_ms: 30000
  half_close_fallback_ms: 5000
