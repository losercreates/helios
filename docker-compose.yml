services:
  helios:
    build:
      context: .
      dockerfile: Dockerfile
    image: helios:latest
    container_name: helios-proxy
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "9090:9090"
    security_opt:
      - seccomp:unconfined
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - ./config/docker_demo.yaml:/etc/helios/helios.yaml:ro
    command: ["-c", "/etc/helios/helios.yaml", "--daemon"]
    depends_on:
      - backend1
      - backend2

  backend1:
    image: nginx:alpine
    container_name: helios-backend1
    restart: unless-stopped
    command: /bin/sh -c 'echo "Hello from Backend 1 (Helios io_uring Proxy)" > /usr/share/nginx/html/index.html && exec nginx -g "daemon off;"'
    expose:
      - "80"

  backend2:
    image: nginx:alpine
    container_name: helios-backend2
    restart: unless-stopped
    command: /bin/sh -c 'echo "Hello from Backend 2 (Helios io_uring Proxy)" > /usr/share/nginx/html/index.html && exec nginx -g "daemon off;"'
    expose:
      - "80"

  prometheus:
    image: prom/prometheus:latest
    container_name: helios-prometheus
    restart: unless-stopped
    ports:
      - "9091:9090"
    volumes:
      - ./packaging/docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - helios

  grafana:
    image: grafana/grafana:latest
    container_name: helios-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_USERS_DEFAULT_THEME=dark
    volumes:
      - ./packaging/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./packaging/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

